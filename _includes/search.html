<!-- Search -->
<div id="search-page" class="search-page" role="dialog" aria-modal="true" aria-label="搜索文章" aria-hidden="true" inert>
  <div class="search-icon-close-container">
    <button type="button" class="search-icon-close" aria-label="关闭搜索">
      <i class="fa fa-chevron-down" aria-hidden="true"></i>
    </button>
  </div>
  <div class="search-main container">
    <div class="row">
      <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
        <form role="search">
          <label class="sr-only" for="search-input">搜索文章</label>
          <input type="search" id="search-input" placeholder="$ grep..." autocomplete="off" enterkeyhint="search">
        </form>
        <div id="search-results" class="mini-post-list" aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>
